<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HetIsRoan FM - Live Radio</title>
    <style>
        /* CSS Styling voor een strakke, donkere speler */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        .player-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2d2d2d;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 150px;
            border: 0;
            border-radius: 12px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HetIsRoan FM</h1>
        <div class="player-card">
            <!-- AzuraCast Embed Speler via https:// -->
            <iframe src="http://listen.hetisroan.nl/public/hetisroan_fm/embed" frameborder="0" allowtransparency="true" style="width: 100%; min-height: 150px; height: 150px; border: 0;"></iframe>
        </div>
    </div>

    <script>
        // JavaScript om te controleren of de pagina geladen is
        document.addEventListener("DOMContentLoaded", function() {
            console.log("HetIsRoan FM website succesvol geladen!");
        });
    </script>

</body>
</html>
