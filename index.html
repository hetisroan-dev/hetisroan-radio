<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HetIsRoan FM - Live Radio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .player-card {
            width: 360px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background-color: #6b21a8;
        }

        .player-header {
            display: flex;
            padding: 16px;
            align-items: center;
            gap: 16px;
        }

        .art-container {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            background-color: #4c1d95;
        }

        .art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .dj-badge {
            align-self: flex-start;
            background-color: #2563eb;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: 13px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            background-color: #f3e8ff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #581c87;
            border: none;
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .volume-slider {
            width: 100%;
            accent-color: #2563eb;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="player-card">
        <div class="player-header">
            <div class="art-container">
                <img id="art"
                    src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&auto=format&fit=crop&q=80"
                    alt="Album Art" />
            </div>
            <div class="track-info">
                <div id="dj" class="dj-badge">Laden...</div>
                <div id="title" class="title">Titel laden...</div>
                <div id="artist" class="artist">Artiest laden...</div>
            </div>
        </div>

        <div class="player-controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">
                ▶
            </button>
            <div class="volume-container">
                <span style="color: #581c87; font-weight: bold;">🔊</span>
                <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.01" value="0.8"
                    oninput="setVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- Jouw directe streamlink -->
    <audio id="audioStream" src="http://listen.hetisroan.nl/listen/hetisroan_fm/radio.mp3" preload="none"></audio>

    <script>
        // Let op: als je lokaal test gebruik je http://localhost, 
        // als je via je publieke server/domein draait pas je dit aan.
        const baseUrl = "http://localhost";
        const stationShortcode = "hetisroan_fm";
        const apiUrl = `${baseUrl}/api/nowplaying/${stationShortcode}`;

        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const artImg = document.getElementById('art');

        let isPlaying = false;
        let currentTrackQuery = "";
        const defaultArt = "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&auto=format&fit=crop&q=80";

        artImg.onerror = function () {
            artImg.src = defaultArt;
        };

        // Automatisch albumhoes zoeken via iTunes op basis van artiest + titel
        async function fetchITunesArt(artist, title) {
            try {
                const query = encodeURIComponent(`${artist} ${title}`);
                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
                }
            } catch (err) {
                console.error("iTunes Art zoeken mislukt:", err);
            }
            return null;
        }

        async function updateNowPlaying() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const title = data.now_playing.song.title || "Onbekend Nummer";
                const artist = data.now_playing.song.artist || "Onbekende Artiest";

                document.getElementById('title').innerText = title;
                document.getElementById('artist').innerText = artist;

                if (data.live && data.live.is_live) {
                    document.getElementById('dj').innerText = data.live.streamer_name;
                } else {
                    document.getElementById('dj').innerText = "Non-Stop";
                }

                const trackQuery = `${artist} - ${title}`;
                if (trackQuery !== currentTrackQuery) {
                    currentTrackQuery = trackQuery;

                    let artUrl = data.now_playing.song.art;
                    if (artUrl && artUrl.length > 5 && !artUrl.includes('generic_song')) {
                        artImg.src = artUrl.startsWith('http') ? artUrl : `${baseUrl}${artUrl}`;
                    } else {
                        const iTunesArt = await fetchITunesArt(artist, title);
                        if (iTunesArt) {
                            artImg.src = iTunesArt;
                        } else {
                            artImg.src = defaultArt;
                        }
                    }
                }

            } catch (error) {
                console.error("Fout bij ophalen van Now Playing data:", error);
            }
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = "▶";
            } else {
                audio.play().then(() => {
                    playBtn.innerHTML = "❚❚";
                }).catch(err => {
                    console.error("Afspelen geblokkeerd door browser:", err);
                });
            }
            isPlaying = !isPlaying;
        }

        function setVolume(val) {
            audio.volume = val;
        }

        setInterval(updateNowPlaying, 5000);
        updateNowPlaying();
    </script>
</body>

</html>
