<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HetIsRoan FM - Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Player Card Outer Container */
    .player-card {
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Bovenste Paarse Sectie */
    .player-top {
      background-color: #5c24b5;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      color: #ffffff;
    }

    .album-art {
      width: 110px;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .badge {
      align-self: flex-start;
      background-color: #1e62ec;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 2px;
    }

    .song-title {
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-arrow {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 20px;
      height: 20px;
      fill: #ffffff;
      cursor: pointer;
      opacity: 0.9;
    }

    /* Onderste Lichtgrijze Control Sectie */
    .player-bottom {
      background-color: #f3f0f9;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #5c24b5;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      margin-left: 2px; /* Lichte correctie voor afspeelicoon */
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
    }

    .volume-icon {
      width: 24px;
      height: 24px;
      fill: #5c24b5;
      flex-shrink: 0;
    }

    /* Custom Slider Range */
    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #ded7eb;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1e62ec;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1e62ec;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Bovenste deel met albumhoes & metadata -->
    <div class="player-top">
      <img id="art" class="album-art" src="" alt="Album Art">
      <div class="song-info">
        <span id="stream-status" class="badge">Non-Stop</span>
        <div id="title" class="song-title">Laden...</div>
        <div id="artist" class="song-artist">HetIsRoan FM</div>
      </div>
      <!-- Pijltje icoon rechtsboven -->
      <svg class="dropdown-arrow" viewBox="0 0 24 24">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
      </svg>
    </div>

    <!-- Onderste deel met controls -->
    <div class="player-bottom">
      <button id="playBtn" class="play-btn">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <div class="volume-container">
        <svg class="volume-icon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <!-- Audio-element -->
  <audio id="audioStream" src="https://listen.hetisroan.nl/listen/hetisroan_fm/radio.mp3" preload="none"></audio>

  <script>
    const audio = document.getElementById('audioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const volumeSlider = document.getElementById('volumeSlider');

    // SVG icon paden voor Play & Pause
    const playPath = "M8 5v14l11-7z";
    const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

    // Toggle Play / Pause
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.querySelector('path').setAttribute('d', pausePath);
        }).catch(err => console.error("Afspelen geblokkeerd:", err));
      } else {
        audio.pause();
        playIcon.querySelector('path').setAttribute('d', playPath);
      }
    });

    // Volume regeling
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    // Live Metadata Ophalen via AzuraCast API
    async function updateNowPlaying() {
      try {
        const response = await fetch('https://listen.hetisroan.nl/api/nowplaying/hetisroan_fm');
        if (!response.ok) return;
        const data = await response.json();

        if (data && data.now_playing) {
          const song = data.now_playing.song;
          document.getElementById('title').textContent = song.title || "Onbekend Nummer";
          document.getElementById('artist').textContent = song.artist || "Onbekende Artiest";
          document.getElementById('art').src = song.art || "";

          // Status / Streamertype update
          const isLive = data.live && data.live.is_live;
          document.getElementById('stream-status').textContent = isLive ? "LIVE" : "Non-Stop";
        }
      } catch (err) {
        console.warn("Metadata kon niet geladen worden:", err);
      }
    }

    // Elke 10 seconden verversen
    updateNowPlaying();
    setInterval(updateNowPlaying, 10000);
  </script>
</body>
</html>
